# .cargo/audit.toml: the ONE exception of cargo audit. The audit gate of scripts/ci.sh runs scripts/audit-gate.sh, which first PROVES (cargo tree) that the exception still holds and only then runs cargo audit;
# scripts/audit-gate-test.sh is the cell that keeps it honest (a planted fixture where the crate IS in the build graph must make the proof fail; this file must name exactly one id).
#
# kai (development lead), 10 Nov 2026 11:59Z: RUSTSEC-2026-0459 (libsqlite3-sys 0.37.0, a C SQLite vulnerability) is ignored by cargo audit for v0.2.1 ONLY BECAUSE the crate is a Cargo.lock entry of sqlx's optional sqlite driver and is in no build: cargo tree --locked --offline -i libsqlite3-sys --workspace --all-features --target all prints nothing to print; our sqlx has default-features = false and the features runtime-tokio, postgres, uuid, tls-none; cargo deny says advisories ok. The exception is VOID, and the release must be audited again, the moment that command prints a path or the sqlx features change. Review at the next sqlx bump (v0.2.002).
#
# The exception: exactly one advisory id, no wildcard: RUSTSEC-2026-0459, crate libsqlite3-sys 0.37.0 ("C SQLite CVE-2026-119375", medium 6.8, fixed in >= 0.39.0), added to the RustSec database on 2026-11-09. Authorised on 2026-11-10 by kai (his line above); drafted and measured by hue (receipts: pieces/audit-exception-mechanism-hue).
# Why it does not apply: Cargo.lock lists libsqlite3-sys only as a dependency of sqlx-sqlite, and no workspace crate enables sqlx-sqlite (Cargo.toml: sqlx = "=0.9.0", default-features = false, features runtime-tokio, postgres, uuid, tls-none). cargo deny, which walks the resolved graph, says advisories ok on the same database.
# The tradeoff: this file ignores ONE id. cargo audit still fails on every other advisory, and an advisory that lands DURING a run is not covered by anything here. The text output of cargo audit says nothing about an ignored advisory (measured); the ignore shows in this file and in the --json output (settings.ignore).
# The reviewed basis (sam's AE-SAM-01): the second half of kai's condition, 'or the sqlx features change', is ENFORCED by scripts/audit-gate.sh, which compares every workspace sqlx dependency (version, default-features, the feature SET, in any order) with the basis kai reviewed and fails with EXCEPTION VOID before cargo audit on any difference. It does NOT cover: the optional, target, kind, rename or source of a sqlx dependency, any other crate, or a lock file change; a transitive change that enables sqlite through ANOTHER crate is covered by the graph proof, and a lock change that adds ANOTHER vulnerable crate is cargo audit's own job. Any wider policy is kai's.
[advisories]
ignore = ["RUSTSEC-2026-0459"]
