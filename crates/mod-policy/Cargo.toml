[package]
name = "mod-policy"
description = "Piece 4, mod-policy: roles to scopes and the pure target rules; fails closed (Wave 1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cortex-db.workspace = true
cortex-module.workspace = true
cortex-types.workspace = true

[dev-dependencies]
serde_json.workspace = true
trybuild.workspace = true
# PO-15: the real policy behind the real chain (DB-free). cortex-http is not a mod crate, so xtask allows it.
cortex-http = { path = "../cortex-http" }
async-trait.workspace = true
tokio.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
# PO-05: the compile-fail fixtures name `axum::http::Method` (already in the lock; no new crate).
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }

[lints]
workspace = true
