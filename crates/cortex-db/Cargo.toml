[package]
name = "cortex-db"
description = "One transaction per module operation, under that module's role and project, with synchronous delegation (F-1b)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test-only switches (the nonlocal control, the seal-off control). Never enabled outside tests (F1-16).
testkit = []
# BANKED for v0.2.001 (the walking skeleton; Wave 0's S1): the migration guard (F1-13, reworks 2 to 9)
# and the runtime-DDL maintenance functions (F1-31). Off by default; their tests run with them on:
#   cargo test --workspace --features cortex-db/guard,cortex-db/maintenance,cortex-testkit/maintenance
guard = []
maintenance = []

[dependencies]
cortex-types.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
cortex-testkit.workspace = true
cortex-db = { path = ".", features = ["testkit"] }
cortex-types = { workspace = true, features = ["testkit"] }

[lints]
workspace = true

# The banked features' tests (unchanged files): built and run only with their feature on.

[[test]]
name = "f1_12_13"
required-features = ["guard"]

[[test]]
name = "f1_31_access"
required-features = ["maintenance"]

[[test]]
name = "f1_31_audit"
required-features = ["maintenance"]

[[test]]
name = "f1_31_eligibility"
required-features = ["maintenance"]

[[test]]
name = "f1_31_identity"
required-features = ["maintenance"]

[[test]]
name = "f1_31_roles"
required-features = ["maintenance"]

[[test]]
name = "f1_31_shadowing"
required-features = ["maintenance"]

[[test]]
name = "f1_31_snapshot_guard"
required-features = ["maintenance"]

[[test]]
name = "f1_31_startup"
required-features = ["maintenance"]

[[test]]
name = "f1_31_values_authority"
