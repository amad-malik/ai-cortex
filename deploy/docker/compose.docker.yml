# Cortex v2 on Docker Desktop (macOS): an OVERRIDE for deploy/compose.yml, merged over it and never a copy of it (M-1b; cox rows e6aed96f, 5f3cd001).
#   docker compose -f deploy/compose.yml -f deploy/docker/compose.docker.yml ...      (scripts/docker-compose-render makes that call)
# It changes secrets, image and the server tmpfs; every other line of the base (the :z flags, which Docker ignores where there is no SELinux; the loopback port;
# read_only, migrate tmpfs, cap_drop, no-new-privileges, user 10001; named volumes; limits; health checks) runs unchanged.
#
# 1. THE SECRETS. The base declares its three secrets `external: true` (Podman secrets). Docker's Compose file reference says a top-level secret is built
#    from a file or an environment variable, and that an external secret with any other attribute is rejected; outside Swarm there is no secret object to
#    find (the fetch of docs.docker.com on 8 Nov 2026 does not say Swarm: ASK-A-MAC). So each secret is replaced WHOLE (!override) by a FILE under a directory
#    the installer makes (mode 0700). DRAFT (A), UNPROVEN until M-6: for a file source Compose ignores uid, gid and mode, so uid 10001 and the Postgres user
#    read the host file as Docker Desktop's file sharing shows it (ASK-A-MAC). Option (B), environment secrets, is documented in the plan, not built.
# 2. THE IMAGE. A user's Mac does not build: the release image is loaded from the artifact, so the server and the migrate step take it from the installer's
#    variable, and the server's build block is removed (!reset). The base's pull_policy: never stays: it relies on the loaded image.
# 3. THE SERVER TMPFS. Replace the whole list: keep /tmp and express /run/cortex ownership with explicit uid/gid instead of Podman's U option.
#    Actual tag support, mount ownership and writability need a Docker Desktop run on a Mac.
# The YAML tag !override needs Docker Compose 2.24.4 or later (the merge page of docs.docker.com, read live by sam on 8 Nov 2026). The minimum version of !reset was not
# read by anyone (sam's record names only !override), and which Compose version Docker Desktop bundles on the user's Mac is not known: both are ASK-A-MAC. The Mac-only exception to the Linux checker's rules S5-11 and S5-19 is NAMED here and decided by vera or hue; scripts/docker-compose-lint holds this file
# to exactly this shape and fails if it weakens any hardening line of the base.
services:
  migrate:
    image: ${CORTEX_SERVER_IMAGE:?set by the installer}
  server:
    build: !reset null
    image: ${CORTEX_SERVER_IMAGE:?set by the installer}
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
      - /run/cortex:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700

secrets:
  cv2-s5-db-superuser: !override
    file: ${CORTEX_SECRETS_DIR:?set by the installer}/db-superuser
  cv2-s5-owner-password: !override
    file: ${CORTEX_SECRETS_DIR:?set by the installer}/owner-password
  cv2-s5-app-password: !override
    file: ${CORTEX_SECRETS_DIR:?set by the installer}/app-password
